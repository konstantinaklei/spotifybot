<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>My Top 10 Tracks</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        h1 { color: #1DB954; }
        .track-container { display: flex; align-items: center; margin-bottom: 15px; background: #181818; padding: 10px; border-radius: 8px; }
        .track-container img { border-radius: 4px; margin-right: 15px; }
        .track-info b { font-size: 1.2em; color: #fff; }
        .track-info p { margin: 5px 0 0; color: #b3b3b3; }
    </style>
</head>
<body>
    <h1>Γεια σου, {{ user_name }}!</h1>
    <h2>Τα Top 10 Τραγούδια σου:</h2>

    {% for track in tracks %}
    <div class="track-container">
        <img src="{{ track.album.images[0].url }}" width="80" height="80" alt="Album Art">
        <div class="track-info">
            <b>{{ loop.index }}. {{ track.name }}</b>
            <p>{{ track.artists[0].name }}</p>
        </div>
    </div>
    {% endfor %}

    <br>
    <a href="/" style="color: #1DB954;">Επιστροφή</a>
</body>
</html>
